<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReverseGen · 牌局生成器</title>
<style>
  :root{--bg:#0d1117;--s:#161b22;--b:#30363d;--t:#c9d1d9;--m:#8b949e;--a:#58a6ff;--g:#3fb950;--r:#f85149;--o:#d2991d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);padding:20px;max-width:1100px;margin:0 auto}
  h1{font-size:18px;margin-bottom:4px}
  .sub{color:var(--m);font-size:12px;margin-bottom:20px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .col{flex:1;min-width:300px}
  .card{background:var(--s);border:1px solid var(--b);border-radius:8px;padding:16px;margin-bottom:14px}
  .card h2{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--b)}
  label{display:block;font-size:12px;color:var(--m);margin-bottom:4px;margin-top:10px}
  label:first-child{margin-top:0}
  input,textarea,button{font-family:inherit;font-size:13px}
  input,textarea{width:100%;background:var(--bg);border:1px solid var(--b);border-radius:5px;color:var(--t);padding:8px 10px;outline:none}
  input:focus,textarea:focus{border-color:var(--a)}
  textarea{resize:vertical;min-height:50px;font-family:monospace;font-size:12px}
  button{cursor:pointer;border:none;border-radius:5px;padding:8px 16px;font-weight:600;transition:all .15s}
  .btn-blue{background:var(--a);color:#fff;width:100%;padding:12px;font-size:14px}
  .btn-blue:hover{background:#4090e0}
  .btn-sm{background:var(--b);color:var(--t);padding:5px 12px;font-size:12px}
  .btn-sm:hover{background:#48505a}
  .inrow{display:flex;gap:6px}
  .inrow input{flex:1}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .tag{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--b);color:var(--m);cursor:pointer;font-family:monospace}
  .tag:hover{border-color:var(--a);color:var(--a)}
  .info{font-size:11px;color:var(--m);line-height:1.6;margin-top:6px;min-height:20px}
  .err{color:var(--r);font-size:11px;margin-top:6px}
  .code{background:var(--bg);border:1px solid var(--b);border-radius:5px;padding:10px;font-family:monospace;font-size:11px;word-break:break-all;color:var(--g);max-height:70px;overflow-y:auto;position:relative}
  .code button{position:absolute;top:6px;right:6px;font-size:10px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--bg);border-radius:5px;padding:10px;text-align:center}
  .stat .v{font-size:18px;font-weight:700}.stat .l{font-size:10px;color:var(--m)}
  .g{color:var(--g)}.r{color:var(--r)}.o{color:var(--o)}
  canvas{width:100%;border-radius:5px;margin-top:8px}
  hr{border:none;border-top:1px solid var(--b);margin:14px 0}
  .hint{font-size:10px;color:var(--m);margin-top:4px}
  /* 闭合率滑块 */
  .cr-slider-row{display:flex;align-items:center;margin-top:2px;gap:6px}
  .cr-slider-row span.label{width:52px;font-size:10px;color:var(--m);text-align:right;line-height:1.3}
  .cr-slider-row span.val{width:44px;font-size:10px;color:var(--t);text-align:right;font-family:monospace}
  .cr-slider{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;outline:none;background:linear-gradient(to right, var(--b) 0%, var(--b) 20%, #555 20%, #555 60%, var(--b) 60%, var(--b) 100%)}
  .cr-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--a);cursor:pointer}
  .cr-slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--a);cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
  th,td{padding:4px 8px;text-align:left;border-bottom:1px solid var(--b)}
  th{color:var(--m);font-size:10px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
  #status{position:fixed;bottom:0;left:0;right:0;background:var(--r);color:#fff;padding:6px 16px;font-size:11px;font-family:monospace;display:none;z-index:999}
</style>
</head>
<body>

<h1>🎴 ReverseGen</h1>
<div class="sub">牌局生成器 · LayerClosure / CostLadder · 与 Unity 解耦 &nbsp;|&nbsp; <a href="/analysis.html" style="color:var(--a)">🧬 Triple 关系分析器</a></div>

<div id="status"></div>

<div class="row">
<div class="col">
  <!-- ═══ 地形 ═══ -->
  <div class="card">
    <h2>🗺️ 地形</h2>

    <label>关卡 ID</label>
    <div class="inrow">
      <input type="number" id="levelId" placeholder="如 100002" list="levelList" style="font-size:15px;font-weight:600">
      <button class="btn-sm" onclick="loadLevel()">加载</button>
    </div>
    <datalist id="levelList"></datalist>

    <div class="info" id="levelInfo"></div>

    <div class="inrow" style="margin-top:4px">
      <input type="text" id="levelsDir" placeholder="关卡目录（自动检测）" style="font-size:10px">
      <button class="btn-sm" onclick="scanLevels()">扫描</button>
    </div>
  </div>

  <!-- ═══ 算法 & 参数 ═══ -->
  <div class="card">
    <h2>⚙️ 生成算法</h2>

    <label>算法选择</label>
    <select id="algorithm" onchange="switchAlgoPanel()" style="width:100%;background:var(--bg);border:1px solid var(--b);border-radius:5px;color:var(--t);padding:8px 10px;font-size:13px;font-family:inherit">
      <option value="closure">LayerClosure（层闭合 · 控制每层债务 / 必死）</option>
      <option value="cost-ladder">CostLadder（精确控制消除难度曲线）</option>
    </select>

    <!-- CostLadder 参数面板 -->
    <div id="panelCostLadder" style="display:none">
      <label style="margin-top:10px">Cost 数组（逗号分隔）</label>
      <div class="inrow" style="margin-bottom:6px">
        <input type="number" id="targetStd" value="1.0" min="0" max="3" step="0.1" style="width:70px;font-size:11px" placeholder="σ">
        <button class="btn-sm" onclick="generateCost()">🎲 生成Cost</button>
        <span style="font-size:10px;color:var(--m);line-height:2.2;flex:1">标准差 σ</span>
      </div>
      <textarea id="costArray" placeholder="如: 3,3,2,2,2,1"></textarea>
    </div>

    <!-- LayerClosure 参数面板 -->
    <div id="panelClosure">
      <label style="margin-top:10px">每层闭合率 % <span style="font-weight:normal;font-size:10px;color:var(--m)">（到该层为止闭合的花色占比）</span></label>
      <div id="closeRateSliders"><span style="font-size:11px;color:var(--m)">请先加载地形...</span></div>
      <input type="hidden" id="closeRates" value="">

      <div class="inrow" style="margin-top:8px">
        <div style="flex:1"><label>深度散布</label><input type="number" id="spread" value="0" min="0" max="100"></div>
        <div style="flex:1"><label>Dock容量</label><input type="number" id="dock" value="7" min="1" max="20"></div>
      </div>
    </div>

    <div class="inrow" style="margin-top:10px">
      <div style="flex:1"><label>花色数</label><input type="number" id="colorCount" value="8" min="1" max="99"></div>
      <div style="flex:1"><label>Level Hash</label><input type="text" id="levelHash" placeholder="自动"></div>
    </div>

    <button class="btn-blue" onclick="generate()" style="margin-top:12px">🔄 生成牌局</button>
    <div class="err" id="genErr"></div>
  </div>

  <!-- ═══ 解码 ═══ -->
  <div class="card">
    <h2>🔍 解码 ReplayCode</h2>
    <textarea id="decodeInput" placeholder="粘贴 ReplayCode..." style="min-height:40px;font-size:11px"></textarea>
    <button class="btn-sm" onclick="decodeCode()" style="width:100%;margin-top:6px">解码</button>
    <div class="info" id="decodeOut"></div>
  </div>
</div>

<div class="col">
  <!-- ═══ 结果 ═══ -->
  <div class="card" id="resultCard" style="display:none">
    <h2>📊 结果</h2>

    <div class="stats" id="stats"></div>

    <h2 style="margin-top:12px" id="chartTitle">Cost Ladder 对比</h2>
    <canvas id="costChart" height="180"></canvas>
    <div style="font-size:10px;color:var(--m);margin-top:4px" id="chartLegend">
      <span>🟦 目标</span> <span>🟩 实际</span>
      <span id="chartLabel" style="margin-left:8px"></span>
    </div>

    <div id="stepSection">
    <h2 style="margin-top:12px">步骤详情 <span style="font-weight:400;font-size:10px;color:var(--m)" id="stepCnt"></span></h2>
    <div style="max-height:260px;overflow-y:auto;border:1px solid var(--b);border-radius:5px">
      <table><thead><tr><th>步</th><th>选中 ID</th><th>cost</th><th>sim</th><th>目标</th><th>候选</th><th>封杀</th><th>色</th><th>备注</th></tr></thead>
      <tbody id="stepBody"></tbody></table>
    </div>
    </div>

    <h2 style="margin-top:12px">花色分布</h2>
    <canvas id="elemChart" height="80"></canvas>

    <h2 style="margin-top:12px">ReplayCode <button class="btn-sm" onclick="copyCode(this)">📋 复制</button></h2>
    <div class="code" id="codeBox"></div>
    <div class="hint">可直接用于 Unity TileMatchBattle.LoadLevel_V2()</div>

    <h2 style="margin-top:12px">🔍 DFS 校验</h2>
    <div class="inrow" style="margin-bottom:6px">
      <button class="btn-sm" onclick="verifyDFS()" id="btnDFS" style="flex:1">运行 DFS 求解</button>
      <span style="font-size:10px;color:var(--m);line-height:2.2">超时 <input type="number" id="dfsTimeout" value="30" min="1" max="120" style="width:40px;font-size:10px">s</span>
    </div>
    <div class="info" id="dfsResult"></div>
  </div>
</div>
</div>

<script>
// ═══════════════════════════════════
// 全局错误捕获
// ═══════════════════════════════════
window.onerror = function(msg,src,line,col,err){
  var s=document.getElementById('status');
  s.style.display='block';
  s.textContent='⚠️ JS错误: '+msg+' (行'+line+') — 打开Console(F12)查看';
  console.error(msg,err);
};

// ═══════════════════════════════════
// 颜色
// ═══════════════════════════════════
var PAL=['#58a6ff','#3fb950','#d2991d','#f85149','#a371f7','#39d2c0','#ff7b72','#79c0ff','#e3b341','#f0883e','#56d364','#db6dab','#a5d6ff','#7ee787','#d2a82e','#ffa657','#f778ba','#96d0ff','#8bdd98','#c69026'];
function ec(e){return PAL[(e-1)%PAL.length]}

// ═══════════════════════════════════
// 扫描关卡（填充 datalist 自动补全）
// ═══════════════════════════════════
async function scanLevels(){
  var dir=document.getElementById('levelsDir').value.trim();
  var list=document.getElementById('levelList');
  list.innerHTML='';
  try{
    var url=dir?'/api/levels?dir='+encodeURIComponent(dir):'/api/levels';
    var r=await fetch(url);
    var d=await r.json();
    if(!d.ok)return;
    for(var i=0;i<d.levels.length;i++){
      var lv=d.levels[i];
      var opt=document.createElement('option');
      opt.value=lv.id;
      opt.label=lv.id+' ('+lv.tiles+'张)';
      list.appendChild(opt);
    }
    document.getElementById('levelsDir').placeholder=d.dir||'';
  }catch(e){}
}

// ═══════════════════════════════════
// 加载关卡信息
// ═══════════════════════════════════
async function loadLevel(){
  var id=document.getElementById('levelId').value.trim();
  var info=document.getElementById('levelInfo');
  if(!id){info.innerHTML='<span style="color:var(--o)">请输入关卡ID</span>';return}
  info.textContent='加载中...';
  try{
    var body={levelId:id};
    var dir=document.getElementById('levelsDir').value.trim();
    if(dir)body.levelsDir=dir;
    var r=await fetch('/api/terrain-info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();
    if(!d.ok){info.innerHTML='<span style="color:var(--r)">❌ '+d.error+'</span>';return}
    var html='<span class="tag" style="color:var(--a);border-color:var(--a)">关卡 '+ (d.levelResId||id) +'</span> ';
    html+=d.layers+'层 · '+d.totalTiles+'张牌 · <b>'+d.freeTiles+'</b>自由牌';
    if(d.constTiles>0)html+=' · '+d.constTiles+'固定牌';
    html+='<br>自由牌÷3 = <b>'+d.steps+'</b>步 · Hash: '+(d.levelHash||'(无)');
    // 深度信息
    if(d.depthCount){
      html+='<br>依赖深度: <b>'+d.depthCount+'</b>层 ['+d.tilesPerDepth.join(', ')+']';
    }
    html+='<br><span style="font-size:9px">'+ (d.resolvedPath||'') +'</span>';
    info.innerHTML=html;
    // CostLadder 提示
    updateCostHint(d.steps);
    // LayerClosure: 自动生成闭合率
    if(d.depthCount) updateCloseRatesHint(d);
  }catch(e){info.innerHTML='<span style="color:var(--r)">❌ '+e.message+'</span>'}
}

function updateCostHint(steps){
  if(!steps)return;
  var ta=document.getElementById('costArray');
  if(!ta.value.trim()){
    ta.placeholder='需要'+steps+'步，如: '+Array(steps).fill(3).join(',');
  }
}

// 根据深度信息生成闭合率滑块（与 HTML 版算法一致）
function updateCloseRatesHint(d){
  var cc=parseInt(document.getElementById('colorCount').value)||8;
  var container=document.getElementById('closeRateSliders');
  var cum=0, html='';
  for(var i=0;i<d.depthCount-1;i++){
    cum+=d.tilesPerDepth[i];
    var maxClosed=Math.floor(cum/3)*3;
    // suitMinClosed
    var maxWaste=Math.min(2*cc,cum);
    while(maxWaste>=0&&(cum-maxWaste)%3!==0)maxWaste--;
    if(maxWaste<0)maxWaste=0;
    var minClosed=cum-maxWaste;
    var suitMinRate=Math.round(minClosed/cum*100);
    // 初始值 = maxClosed 的 80%
    var initClosed=Math.round(maxClosed*0.8/3)*3;
    initClosed=Math.max(initClosed,minClosed);
    if(initClosed<0)initClosed=0;
    var pct=Math.round(initClosed/cum*100);
    var step=(3/cum*100);
    var maxRate=Math.round(maxClosed/cum*100);
    html+='<div class="cr-slider-row">'+
      '<span class="label">1~'+(i+1)+'<br>'+cum+'tile</span>'+
      '<input class="cr-slider" type="range" min="0" max="100" value="'+pct+'" step="'+step.toFixed(3)+'"'+
      ' data-layer="'+(i+1)+'" data-total="'+cum+'" data-minrate="'+suitMinRate+'" data-maxrate="'+maxRate+'"'+
      ' oninput="syncCloseRates(this)">'+
      '<span class="val" id="crv'+i+'">'+pct+'%<br>'+initClosed+'/'+cum+'</span>'+
      '</div>';
  }
  html+='<div style="font-size:10px;color:var(--m);margin-top:2px">1~'+d.depthCount+'层='+d.freeTiles+'tile = 100%（自动）</div>';
  container.innerHTML=html;
  syncCloseRates();
}

// 滑块值 → 隐藏 input + 更新渐变轨道 + 显示值
function syncCloseRates(triggerSlider){
  var sliders=document.querySelectorAll('.cr-slider');
  var rates=[];

  // 收集各层对齐后的值
  var vals=[];
  sliders.forEach(function(s){
    var total=parseInt(s.dataset.total);
    var dc=Math.round(parseFloat(s.value)/100*total);
    dc=Math.round(dc/3)*3;
    vals.push({slider:s, total:total, dc:dc, minrate:parseFloat(s.dataset.minrate), maxrate:parseFloat(s.dataset.maxrate)});
  });

  // 反向收紧：浅层闭合数不能超过深层
  for(var i=vals.length-2;i>=0;i--){
    if(vals[i].dc>vals[i+1].dc) vals[i].dc=vals[i+1].dc;
  }
  // 硬下限
  var cc=parseInt(document.getElementById('colorCount').value)||8;
  for(var i=0;i<vals.length;i++){
    var maxWaste=Math.min(2*cc,vals[i].total);
    while(maxWaste>=0&&(vals[i].total-maxWaste)%3!==0)maxWaste--;
    var minC=vals[i].total-(maxWaste<0?0:maxWaste);
    if(vals[i].dc<minC) vals[i].dc=minC;
  }
  // 正向收紧
  for(var i=1;i<vals.length;i++){
    if(vals[i].dc<vals[i-1].dc) vals[i].dc=vals[i-1].dc;
  }

  // 更新滑块值和渐变
  vals.forEach(function(v){
    var s=v.slider, total=v.total, dc=v.dc;
    var pct=total>0?dc/total*100:0;
    s.value=pct;
    // 渐变：黑(不可达) → 灰(可移) → 蓝(推荐) → 灰(可移)
    var suitMinRt=v.minrate;
    var maxRt=v.maxrate;
    s.style.background='linear-gradient(to right,'+
      '#555 0%,#555 '+suitMinRt+'%,'+
      'var(--b) '+suitMinRt+'%,var(--b) '+maxRt+'%,'+
      '#555 '+maxRt+'%,#555 100%)';
    // 更新显示
    var vid=document.getElementById('crv'+(parseInt(s.dataset.layer)-1));
    if(vid) vid.innerHTML=Math.round(pct)+'%<br>'+dc+'/'+total;
    rates.push(pct/100);
  });

  document.getElementById('closeRates').value=rates.join(',');
}

// ═══════════════════════════════════
// ═══════════════════════════════════
// 生成
// ═══════════════════════════════════
function switchAlgoPanel(){
  var algo=document.getElementById('algorithm').value;
  document.getElementById('panelCostLadder').style.display=algo==='cost-ladder'?'':'none';
  document.getElementById('panelClosure').style.display=algo==='closure'?'':'none';
}

async function generate(){
  var btn=document.querySelector('.btn-blue');
  var err=document.getElementById('genErr');
  err.textContent='';
  btn.textContent='生成中...';btn.disabled=true;

  var lid=document.getElementById('levelId').value.trim();
  var info=document.getElementById('levelInfo');
  if(!lid || info.innerHTML.indexOf('关卡')<0){
    err.textContent='请先加载关卡';
    btn.textContent='🔄 生成牌局';btn.disabled=false;
    return;
  }

  var algo=document.getElementById('algorithm').value;
  var body={levelId:lid, algorithm:algo};
  var dir=document.getElementById('levelsDir').value.trim();
  if(dir)body.levelsDir=dir;
  body.colorCount=document.getElementById('colorCount').value;
  body.levelHash=document.getElementById('levelHash').value.trim()||undefined;

  if(algo==='closure'){
    body.closeRates=document.getElementById('closeRates').value.trim();
    body.spread=document.getElementById('spread').value;
    body.dock=document.getElementById('dock').value;
  }else{
    body.costArray=document.getElementById('costArray').value.trim();
  }

  try{
    var r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    var d=await r.json();
    if(!d.ok){err.textContent=d.error;return}
    showResult(d);
  }catch(e){err.textContent=e.message}
  finally{btn.textContent='🔄 生成牌局';btn.disabled=false}
}

// ═══════════════════════════════════
// 显示结果
// ═══════════════════════════════════
function showResult(d){
  document.getElementById('resultCard').style.display='block';
  document.getElementById('codeBox').textContent=d.replayCode;

  if(d.algorithm==='closure'){
    showClosureResult(d);
  }else{
    showCostLadderResult(d);
  }

  // 保存上下文供 DFS 校验使用
  window._lastGen=d;

  drawElemChart(d);
}

function showClosureResult(d){
  var m=d.metrics;
  var doomCls=m.isDoomed?'r':'g';
  var doomTxt=m.isDoomed?'⚠ 是':'✓ 否';

  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="v '+doomCls+'">'+doomTxt+'</div><div class="l">必输判定</div></div>'+
    '<div class="stat"><div class="v">'+m.peakDebt+'/'+m.peakExpDebt+'</div><div class="l">债务峰值/暴露</div></div>'+
    '<div class="stat"><div class="v o">'+m.oi+'</div><div class="l">OI</div></div>'+
    '<div class="stat"><div class="v">'+m.colorCount+'</div><div class="l">花色数</div></div>'+
    '<div class="stat"><div class="v">'+m.depthCount+'</div><div class="l">深度层数</div></div>'+
    '<div class="stat"><div class="v">'+d.terrainSummary.totalTiles+'</div><div class="l">总牌数</div></div>'+
    '<div class="stat"><div class="v">'+m.averageOcclusion+'</div><div class="l">平均遮挡</div></div>'+
    '<div class="stat"><div class="v '+(m.allSuitsClosed?'g':'r')+'">'+(m.allSuitsClosed?'✓':'✗')+'</div><div class="l">花色*3</div></div>';

  // 闭合率对比 chart
  var c=document.getElementById('costChart');
  var ctx=c.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var rect=c.getBoundingClientRect();
  var W=rect.width,H=180;
  c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  var pad={t:14,r:14,b:28,l:48},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  var n=m.depthCount,gw=cw/n,bw=Math.max(4,gw*0.5);

  // Grid
  for(var v=0;v<=100;v+=20){
    var y=pad.t+ch-(v/100)*ch;
    ctx.strokeStyle=v?'#21262d':'#30363d';ctx.lineWidth=v?0.5:1;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='#8b949e';ctx.font='9px system-ui';ctx.textAlign='right';
    ctx.fillText(v+'%',pad.l-4,y+3);
  }
  // Bars: 设定 vs 实际
  var origStr=document.getElementById('closeRates').value;
  var origRates=origStr?origStr.split(',').map(Number):[];
  for(var i=0;i<n;i++){
    var x=pad.l+gw*i;
    // 设定（用户输入的闭合率，最后一层固定100%）
    ctx.fillStyle='rgba(88,166,255,0.3)';
    var setH=(origRates&&i<origRates.length?origRates[i]:(i===n-1?1:0))*ch;
    ctx.fillRect(x+bw*0.1,pad.t+ch-setH,bw*0.35,setH);
    // 实际（算法执行后的真实闭合率）
    ctx.fillStyle='#3fb950';
    var actH=m.actualCloseRates[i]*ch;
    ctx.fillRect(x+bw*0.5,pad.t+ch-actH,bw*0.35,actH);
    ctx.fillStyle='#8b949e';ctx.font='9px system-ui';ctx.textAlign='center';
    ctx.fillText('L'+(i+1),x+bw/2,H-pad.b+14);
  }
  document.getElementById('chartLabel').textContent='闭合率 设定 vs 实际 ▸ 峰值债务:'+m.peakDebt+' 暴露峰值:'+m.peakExpDebt+' OI:'+m.oi;

  // LayerClosure 不需要步骤详情表
  document.getElementById('stepSection').style.display='none';
  document.getElementById('chartTitle').textContent='闭合率 设定 vs 实际';
  document.getElementById('chartLegend').innerHTML='<span style="color:#58a6ff">🟦 设定</span> <span style="color:#3fb950">🟩 实际</span> <span id="chartLabel" style="margin-left:8px"></span>';
}

function showCostLadderResult(d){
  var m=d.matchRate!=null?d.matchRate.toFixed(0)+'%':'N/A';
  var mc=d.matchRate!=null?(d.matchRate>=80?'g':d.matchRate>=50?'o':'r'):'';
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="v '+mc+'">'+m+'</div><div class="l">匹配率</div></div>'+

    '<div class="stat"><div class="v">'+d.stats.min+'/'+d.stats.max+'</div><div class="l">Cost min/max</div></div>'+
    '<div class="stat"><div class="v">'+d.stats.avg.toFixed(1)+'</div><div class="l">Cost 均值</div></div>'+

    '<div class="stat"><div class="v">'+d.terrainSummary.freeTiles+'/'+d.terrainSummary.constTiles+'</div><div class="l">自由/固定</div></div>';

// ═══════════════════════════════════
// Cost Chart
// ═══════════════════════════════════
function drawCostChart(d){
  var c=document.getElementById('costChart');
  var ctx=c.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var r=c.getBoundingClientRect();
  var W=r.width,H=180;
  c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  var steps=d.costLog.length;
  if(!steps)return;
  var tgt=d.costTargets||[];
  var mx=Math.max.apply(null,d.costLog.concat(tgt));
  if(mx<1)mx=1;
  var pad={t:14,r:14,b:28,l:28},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  var gw=cw/steps,bw=Math.max(3,gw*0.55);

  // Grid
  for(var v=0;v<=mx;v++){
    var y=pad.t+ch-(v/mx)*ch;
    ctx.strokeStyle=v?'#21262d':'#30363d';ctx.lineWidth=v?0.5:1;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    ctx.fillStyle='#8b949e';ctx.font='9px system-ui';ctx.textAlign='right';
    ctx.fillText(v,pad.l-4,y+3);
  }
  // Labels
  ctx.textAlign='center';
  var iv=Math.max(1,Math.floor(steps/14));
  for(var i=0;i<steps;i+=iv){
    ctx.fillStyle='#8b949e';ctx.fillText(i+1,pad.l+gw*i+gw/2,H-pad.b+14);
  }
  ctx.fillText('步数',W/2,H-2);

  // Bars
  for(var i=0;i<steps;i++){
    var x=pad.l+gw*i;
    var ah=(d.costLog[i]/mx)*ch,ay=pad.t+ch-ah;
    if(tgt.length&&i<tgt.length){
      var th=(tgt[i]/mx)*ch,ty=pad.t+ch-th;
      var ok=d.costLog[i]===tgt[i];
      ctx.fillStyle=ok?'rgba(88,166,255,.15)':'rgba(88,166,255,.08)';
      ctx.fillRect(x+gw*0.05,ty,gw*0.9,th);
      ctx.strokeStyle='rgba(88,166,255,.3)';ctx.lineWidth=1;
      ctx.setLineDash([2,2]);ctx.strokeRect(x+gw*0.05,ty,gw*0.9,th);ctx.setLineDash([]);
      ctx.fillStyle=ok?'#3fb950':'#f85149';
      ctx.fillRect(x+gw*0.2,ay,gw*0.6,Math.max(1,ah));
    }else{
      ctx.fillStyle=ec((i%8)+1);
      ctx.fillRect(x+gw*0.1,ay,gw*0.8,Math.max(1,ah));
    }
  }
}

// ═══════════════════════════════════
// 步骤详情表
// ═══════════════════════════════════
function renderStepTable(d){
  var log=d.stepLog||[];
  document.getElementById('stepCnt').textContent=log.length+'步';
  var rows='';
  for(var i=0;i<log.length;i++){
    var s=log[i];
    var note='';
    if(s.rescued) note='<span style=\"color:#f85149;font-weight:600\">⚠抢救(第'+s.bannedAtStep+'步拉黑)</span>';
    var costCol=s.target>0&&s.cost!==s.target
      ? '<span style=\"color:#f85149\">'+s.cost+'</span>'
      : '<span style=\"color:#3fb950\">'+s.cost+'</span>';
    var simVal=s.simCost!==undefined?s.simCost:'-';
    var simCol=s.target>0&&s.simCost!==s.target
      ? '<span style=\"color:#f85149\">'+simVal+'</span>'
      : '<span style=\"color:#3fb950\">'+simVal+'</span>';
    rows+='<tr>'+
      '<td>'+s.step+'</td>'+
      '<td><b>['+s.tileIds.join(',')+']</b></td>'+
      '<td>'+costCol+'</td>'+
      '<td>'+simCol+'</td>'+
      '<td>'+(s.target>0?s.target:'-')+'</td>'+
      '<td>'+s.candidateCount+'</td>'+
      '<td>'+s.bannedCount+'</td>'+
      '<td>'+s.colorIndex+'</td>'+
      '<td>'+note+'</td>'+
      '</tr>';
  }
  document.getElementById('stepBody').innerHTML=rows;
}

// ═══════════════════════════════════
// Elem Chart
// ═══════════════════════════════════
function drawElemChart(d){
  var c=document.getElementById('elemChart');
  var ctx=c.getContext('2d');
  var dpr=window.devicePixelRatio||1;
  var r=c.getBoundingClientRect();
  var W=r.width,H=80;
  c.width=W*dpr;c.height=H*dpr;ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  var dist={};
  for(var k in d.assignments){var e=d.assignments[k];dist[e]=(dist[e]||0)+1}
  var ents=Object.entries(dist).sort(function(a,b){return +a[0]-+b[0]});
  if(!ents.length)return;
  var mx=Math.max.apply(null,ents.map(function(e){return e[1]}));
  var pad={t:6,r:10,b:18,l:10},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  var gap=cw/ents.length,bw=Math.min(30,gap*0.7);
  ents.forEach(function(e,i){
    var x=pad.l+gap*i+(gap-bw)/2;
    var bh=Math.max(1,(e[1]/mx)*ch),y=pad.t+ch-bh;
    ctx.fillStyle=ec(+e[0]);
    ctx.fillRect(x,y,bw,bh);
    ctx.fillStyle='#c9d1d9';ctx.font='9px system-ui';ctx.textAlign='center';
    ctx.fillText(e[1],x+bw/2,y-3);
    ctx.fillText('花'+e[0],x+bw/2,H-4);
  });
}

// ═══════════════════════════════════
// 解码
// ═══════════════════════════════════
async function decodeCode(){
  var code=document.getElementById('decodeInput').value.trim();
  var out=document.getElementById('decodeOut');
  if(!code){out.textContent='';return}
  out.textContent='解码中...';
  try{
    var r=await fetch('/api/decode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({replayCode:code})});
    var d=await r.json();
    if(!d.ok){out.innerHTML='<span style="color:var(--r)">'+d.error+'</span>';return}
    var dist={};
    for(var i=0;i<d.tiles.length;i++){var ev=d.tiles[i].elemValue;dist[ev]=(dist[ev]||0)+1}
    out.innerHTML='<b>v'+d.version+'</b> · '+d.tileCount+'张牌 · '+d.elementCount+'种花色 · Hash: '+d.levelHash+
      ' · Dock: '+d.dockEntries.length+'<br>分布: '+Object.entries(dist).sort(function(a,b){return +a[0]-+b[0]}).map(function(e){return '<span style="color:'+ec(+e[0])+'">花'+e[0]+':'+e[1]+'</span>'}).join(' · ');
  }catch(e){out.innerHTML='<span style="color:var(--r)">'+e.message+'</span>'}
}

// ═══════════════════════════════════
// DFS 校验
// ═══════════════════════════════════
async function verifyDFS(){
  var d=window._lastGen;
  if(!d){document.getElementById('dfsResult').innerHTML='<span style="color:var(--o)">请先生成牌局</span>';return}
  var btn=document.getElementById('btnDFS');
  var out=document.getElementById('dfsResult');
  btn.textContent='⏳ DFS 求解中...';btn.disabled=true;
  out.textContent='';
  try{
    var timeout=parseInt(document.getElementById('dfsTimeout').value)||10;
    var r=await fetch('/api/dfs-verify',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({replayCode:d.replayCode,levelId:document.getElementById('levelId').value,timeout:timeout})
    });
    var v=await r.json();
    if(!v.ok){out.innerHTML='<span style="color:var(--r)">'+v.error+'</span>';return}
    var cls=v.solvable?'g':'r';
    var txt=v.solvable?'✓ 有解':'✗ 无解';
    if(!v.solvable&&v.failReason)txt+=' ('+v.failReason+')';
    out.innerHTML='<span style="color:var(--'+cls+')"><b>'+txt+'</b></span>'+
      ' · 搜索 '+v.statesVisited+' 状态 · '+(v.elapsedMs/1000).toFixed(1)+'s';
  }catch(e){out.innerHTML='<span style="color:var(--r)">'+e.message+'</span>'}
  finally{btn.textContent='运行 DFS 求解';btn.disabled=false}
}

// ═══════════════════════════════════
// Cost 数组生成器
// ═══════════════════════════════════
function getStepCount(){
  var info=document.getElementById('levelInfo');
  if(info&&info.textContent){
    var m=info.textContent.match(/(\d+)\s*步/);
    if(m)return parseInt(m[1]);
  }
  return 0;
}

function generateCost(){
  var steps=getStepCount();
  if(!steps||steps<=0){alert('请先加载关卡');return}

  var targetStd=parseFloat(document.getElementById('targetStd').value)||1.0;
  var seed=Date.now()&0x7fffffff;

  // 客户端 PRNG (mulberry32)
  var s=seed|0;
  function rng(){s=(s+0x6d2b79f5)|0;var t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;}

  // 中性交换算法
  var arr=[];
  for(var i=0;i<steps;i++)arr.push(3);

  if(targetStd>0.05){
    // 散射: 先随机交换 N*2 次创建初始方差
    for(var sc=0;sc<steps*2;sc++){
      var hi=Math.floor(rng()*steps);
      var lo2=Math.floor(rng()*steps);
      if(hi===lo2||arr[hi]<=1||arr[lo2]>=8)continue;
      var cand=[].concat(arr);cand[hi]-=1;cand[lo2]+=1;
      // 快速合法性检查
      var rr=0,ok2=true;
      for(var jj=0;jj<cand.length&&ok2;jj++){
        var cc=cand[jj];
        if(cc<1||cc>8)ok2=false;
        rr=rr+cc-3;
        if(rr<0)ok2=false;
        if(rr>2*(cand.length-1-jj))ok2=false;
      }
      if(ok2&&rr===0){arr[hi]=cand[hi];arr[lo2]=cand[lo2];}
    }

    var best=[].concat(arr);
    var bestStd=0;

    function calcStd(a){var v=0;for(var j=0;j<a.length;j++){v+=(a[j]-3)*(a[j]-3);}return Math.sqrt(v/a.length);}

    function isValid(a){
      var r=0;
      for(var j=0;j<a.length;j++){
        var c=a[j];
        if(c<1||c>8)return false;
        r=r+c-3;
        if(r<0)return false;
        if(r>2*(a.length-1-j))return false;
      }
      return r===0;
    }

    function shuffle(a){
      for(var j=a.length-1;j>0;j--){
        var k=Math.floor(rng()*(j+1));
        var t=a[j];a[j]=a[k];a[k]=t;
      }
    }

    bestStd=calcStd(best);

    for(var iter=0;iter<2000;iter++){
      var curStd=calcStd(best);
      if(Math.abs(curStd-targetStd)<=0.1)break;

      var needMore=curStd<targetStd;
      var dec=[],inc=[];
      for(var j=0;j<best.length;j++){
        if(best[j]>1)dec.push(j);
        if(best[j]<8)inc.push(j);
      }
      if(!dec.length||!inc.length)break;

      shuffle(dec);shuffle(inc);
      var found=false;

      for(var di=0;di<dec.length&&!found;di++){
        for(var ii=0;ii<inc.length&&!found;ii++){
          var hi=dec[di],lo=inc[ii];
          if(hi===lo)continue;

          var cand=[].concat(best);
          if(cand[hi]<=cand[lo])continue;
          cand[hi]-=1;
          cand[lo]+=1;

          if(isValid(cand)){
            var ns=calcStd(cand);
            if(Math.abs(ns-targetStd)<Math.abs(bestStd-targetStd)){
              best=cand;bestStd=ns;found=true;
            }
          }
        }
      }
      if(!found)break;
    }
    arr=best;
  }

  document.getElementById('costArray').value=arr.join(',');
}
