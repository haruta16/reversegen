<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1140" viewBox="0 0 1560 1140" font-family='"Segoe UI","Microsoft YaHei",sans-serif'>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<text x="30" y="46" font-size="19" font-weight="800" fill="#0f172a">图3 · 单次点击的动作时序</text><rect x="34" y="54" width="120" height="4" rx="2" fill="#ea580c"/><text x="164" y="50" font-size="12.5" fill="#64748b">OfflineGame.collect 内部步骤：收集 → 三消 → 机制分发 → 步骤应用 → 泡泡 tick</text><rect x="60" y="90" width="840" height="88" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="480" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">① collect(tileId) · 点击收集</text>
<text x="480" y="138" text-anchor="middle" font-size="12.5" fill="#334155">桌面移除 → 进 Dock → sortDockTiles</text><rect x="60" y="218" width="840" height="88" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="480" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">② onTileCollected(tile)</text>
<text x="480" y="266" text-anchor="middle" font-size="12.5" fill="#334155">揭示 isDone · 衰减有效收集 · 订单 consumed（COLLECT_HOOKS）</text><path d="M 480 178 L 480 218" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="346" width="840" height="88" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="480" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">③ checkDockMatch()</text>
<text x="480" y="394" text-anchor="middle" font-size="12.5" fill="#334155">Dock 内同色 ≥3 → 移入 Discard（Destroyed）</text><path d="M 480 306 L 480 346" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="474" width="840" height="88" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="480" y="500" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">④ mechanics.onMatch(matched)</text>
<text x="480" y="522" text-anchor="middle" font-size="12.5" fill="#334155">按 leader.extras 查 MATCH_BEHAVIORS</text>
<text x="480" y="540" text-anchor="middle" font-size="12.5" fill="#334155">魔药31 · 蒲公英36 · 礼盒37</text><path d="M 480 434 L 480 474" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="602" width="840" height="88" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="480" y="628" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">⑤ applyMechanicStep(step)</text>
<text x="480" y="650" text-anchor="middle" font-size="12.5" fill="#334155">actionCount++ · mechanicLog 记录</text>
<text x="480" y="668" text-anchor="middle" font-size="12.5" fill="#334155">STEP_APPLIERS[step.type] 应用 · applyDecayStep</text><path d="M 480 562 L 480 602" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="730" width="840" height="88" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="480" y="756" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">⑥ updateTilesState()</text>
<text x="480" y="778" text-anchor="middle" font-size="12.5" fill="#334155">依赖重算 → Clickable 更新</text><path d="M 480 690 L 480 730" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="858" width="840" height="88" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="480" y="884" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">⑦ applyDecayStep(this, collect)</text>
<text x="480" y="906" text-anchor="middle" font-size="12.5" fill="#334155">黄金4 · 日历6 · 复活节8 每步衰减</text><path d="M 480 818 L 480 858" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><rect x="60" y="986" width="840" height="88" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="480" y="1012" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">⑧ runMechanicTicks()</text>
<text x="480" y="1034" text-anchor="middle" font-size="12.5" fill="#334155">actionCount++ 后泡泡 tick 循环至静止</text>
<text x="480" y="1052" text-anchor="middle" font-size="12.5" fill="#334155">guard 64 防病态环</text><path d="M 480 946 L 480 986" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><rect x="960" y="90" width="560" height="310" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/>
<text x="1240" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">派生种子公式（确定性契约）</text>
<text x="1240" y="138" text-anchor="middle" font-size="12.5" fill="#334155">seed = levelId*397 ^ levelResId</text>
<text x="1240" y="156" text-anchor="middle" font-size="12.5" fill="#334155">seed = seed*397 ^ Dock 当前牌数</text>
<text x="1240" y="174" text-anchor="middle" font-size="12.5" fill="#334155">seed = seed*397 ^ Desk 当前牌数</text>
<text x="1240" y="192" text-anchor="middle" font-size="12.5" fill="#334155">seed = seed*397 ^ 已应用步骤数</text>
<text x="1240" y="210" text-anchor="middle" font-size="12.5" fill="#334155">（actionCount，对齐 Unity Steps.Count）</text>
<text x="1240" y="228" text-anchor="middle" font-size="12.5" fill="#334155">seed = seed*397 ^ 盐值（salt）</text>
<text x="1240" y="246" text-anchor="middle" font-size="12.5" fill="#334155">unchecked int32 · 消费顺序与 Unity 一致</text><rect x="960" y="440" width="560" height="200" rx="10" fill="#fae8ff" stroke="#c026d3" stroke-width="1.6"/>
<text x="1240" y="466" text-anchor="middle" font-size="15" font-weight="700" fill="#c026d3">泡泡 tick 语义</text>
<text x="1240" y="488" text-anchor="middle" font-size="12.5" fill="#334155">0.5s 冷却 = 1 次动作 tick</text>
<text x="1240" y="506" text-anchor="middle" font-size="12.5" fill="#334155">指派 → Dock 空时吸取 → Dock 魔法清除</text>
<text x="1240" y="524" text-anchor="middle" font-size="12.5" fill="#334155">魔法清除后冷却置 0，下一 tick 直接指派</text>
<text x="1240" y="542" text-anchor="middle" font-size="12.5" fill="#334155">配置39: 每轮收集数（0 = 随机 2-3）</text><rect x="960" y="680" width="560" height="200" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.6"/>
<text x="1240" y="706" text-anchor="middle" font-size="15" font-weight="700" fill="#0d9488">为什么 actionCount 统一计数</text>
<text x="1240" y="728" text-anchor="middle" font-size="12.5" fill="#334155">点击 / 复活 / 机制步骤统一 +1</text>
<text x="1240" y="746" text-anchor="middle" font-size="12.5" fill="#334155">种子"已应用步骤数"随每一步变化</text>
<text x="1240" y="764" text-anchor="middle" font-size="12.5" fill="#334155">保证两侧随机序列逐位一致</text>
<text x="1240" y="782" text-anchor="middle" font-size="12.5" fill="#334155">Undo 不在契约内（对齐文档 2.7）</text><rect x="960" y="920" width="560" height="180" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="1240" y="946" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">机制数据流（衔接图1）</text>
<text x="1240" y="968" text-anchor="middle" font-size="12.5" fill="#334155">tile 挂件: tileExtrasFromTerrain(extraEnum)</text>
<text x="1240" y="986" text-anchor="middle" font-size="12.5" fill="#334155">  → 引擎唯一机制来源（tile-count）</text>
<text x="1240" y="1004" text-anchor="middle" font-size="12.5" fill="#334155">mechanicConfig: 仅泡泡39 行为参数</text>
<text x="1240" y="1022" text-anchor="middle" font-size="12.5" fill="#334155">  → MechanicEngine 构造读取</text></svg>